name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Show repo files
        run: find . -not -path './.git/*' -type f | head -50

      - name: Build debug APK
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts not found - project files were not uploaded"
            exit 1
          fi
          cd "$(dirname "$FILE")"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SnowFella-apk
          path: "**/app-debug.apk"
